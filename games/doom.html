<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doom - Game</title>
    <link rel="stylesheet" href="../assets/css-stuff/normal.css">
    <link rel="stylesheet" href="../assets/css-stuff/crt.css">

<body>
    <div id="dos" style="width:640px;height:480px;"></div>

        Dos(document.getElementById("dos"), {

        });
    </script>
